<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Roofing Quotes</title>
<link rel="preload" as="image" href="roofing-hero-m.jpg" media="(max-width:699px)" fetchpriority="high">
<link rel="preload" as="image" href="roofing-hero-d.jpg" media="(min-width:700px)" fetchpriority="high">
<style>
  :root{
    --cream:#F6F1E7;
    --ink:#14202B;
    --gold:#B8924A;
    --sub:#4A5560;
    --fine:#6A7079;
    --hero:url("roofing-hero-m.jpg");
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- MOBILE (por defecto): foto arriba de fondo, botones apilados ---------- */
  .page{ max-width:520px; margin:0 auto; text-align:center; min-height:100svh; background:var(--cream); }
  .top{
    position:relative;
    min-height:340px;
    padding:16px 20px 26px;
    display:flex; flex-direction:column; justify-content:flex-end;
    background:#14202B var(--hero) center 38% / cover no-repeat;
  }
  .top::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(15,23,42,.28) 0%,rgba(15,23,42,.55) 45%,rgba(15,23,42,.88) 100%);
  }
  .top > *{ position:relative; }
  .brand{
    position:absolute; top:14px; left:0; right:0;
    font-size:12px; letter-spacing:.22em; text-transform:uppercase; font-weight:700;
    color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(27px,7.6vw,34px);
    line-height:1.12; font-weight:700; letter-spacing:-.01em;
    color:#fff; margin:0 0 10px; text-wrap:balance;
    text-shadow:0 2px 8px rgba(0,0,0,.45);
  }
  .sub{ font-size:16.5px; line-height:1.45; color:#e8edf3; margin:0 auto; max-width:34ch; }

  .body{ padding:22px 20px 30px; }
  .q{ font-family:Georgia,"Times New Roman",serif; font-size:21px; font-weight:700; margin:0 0 14px; }
  .btns{ display:grid; grid-template-columns:1fr; gap:14px; }
  .btn{
    appearance:none; border:0; cursor:pointer; width:100%;
    font-family:inherit; font-size:26px; font-weight:800; letter-spacing:.01em; color:#fff;
    height:72px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(3px); }
  .btn:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .yes{ background:linear-gradient(180deg,#22c55e,#16a34a); box-shadow:0 6px 0 #15803d,0 12px 20px rgba(22,163,74,.35); }
  .no{  background:linear-gradient(180deg,#f43f5e,#dc2626); box-shadow:0 6px 0 #b91c1c,0 12px 20px rgba(220,38,38,.30); }
  .lock{ font-size:13px; font-weight:600; color:var(--sub); margin:26px 0 6px; }
  .fine{ font-size:12px; line-height:1.45; color:var(--fine); margin:0 auto; max-width:36ch; }

  /* ---------- COMPUTADOR (>= 700px): foto de fondo a pantalla completa, botones lado a lado ---------- */
  @media (min-width:700px){
    :root{ --hero:url("roofing-hero-d.jpg"); }
    body{ background:#14202B; }
    .page{
      max-width:none; min-height:100vh;
      display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
      padding-bottom:max(36px,6vh);
      position:relative;
      background:#14202B var(--hero) center 30% / cover no-repeat;
    }
    .page::before{
      content:""; position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(15,23,42,.10) 0%,rgba(15,23,42,.22) 32%,rgba(15,23,42,.78) 58%,rgba(15,23,42,.90) 100%);
    }
    .page > *{ position:relative; width:100%; max-width:760px; }
    .top{ background:none; min-height:0; padding:0 24px; display:block; }
    .top::before{ display:none; }
    .brand{ position:static; margin:0 0 22px; font-size:13px; }
    h1{ font-size:clamp(38px,4.2vw,54px); margin-bottom:14px; }
    .sub{ font-size:19px; max-width:46ch; }
    .body{ padding:34px 24px 0; }
    .q{ color:#fff; font-size:25px; margin-bottom:18px; text-shadow:0 2px 8px rgba(0,0,0,.45); }
    .btns{ grid-template-columns:1fr 1fr; gap:20px; max-width:560px; margin:0 auto; }
    .btn{ height:80px; font-size:28px; }
    .lock{ color:#e2e8f0; margin-top:30px; font-size:14px; }
    .fine{ color:#cbd5e1; max-width:none; font-size:13px; }
  }
</style>
</head>
<body>

<!-- RedTrack universal script (same Home Service script as the other prelanders) -->
<script async src="https://trackrt.sweethomecasa.com/unilpclick.js?attribution=lastpaid&cookiedomain=&cookieduration=90&defaultcampaignid=&regviewonce=false&script_id=6a9dfbc2659890b0b77ef49d"></script>

<!-- No Meta Pixel in the browser on purpose (decision 2026-09-28): the real Lead event arrives via RedTrack CAPI. -->

<main class="page">
  <section class="top" role="img" aria-label="Suburban home with a clean shingle roof">
    <div class="brand">Home Service</div>
    <h1>Looking to Replace or Repair Your Roof?</h1>
    <p class="sub">Click below and compare quotes from local contractors.</p>
  </section>

  <section class="body">
    <p class="q">Are you a US resident?</p>
    <div class="btns">
      <button class="btn yes" id="yesBtn">&#10004; Yes</button>
      <button class="btn no" id="noBtn">&#10006; No</button>
    </div>
    <p class="lock">&#128274; We keep your information secure and confidential</p>
    <p class="fine">This is not a free service. Price and cost may vary based on your project.</p>
  </section>
</main>

<script>
  // RedTrack universal click URL. Works for every campaign: the script above stores the visitor's
  // click id and /click sends them to the offer of the campaign that brought them (same as the windows prelander).
  var CLICK_URL = "https://trackrt.sweethomecasa.com/click";
  function go(){ window.location.href = CLICK_URL; }
  document.getElementById('yesBtn').addEventListener('click', go);
  document.getElementById('noBtn').addEventListener('click', go);
</script>

</body>
</html>
