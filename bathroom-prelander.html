<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Bathroom Remodel Quotes</title>

<style>
  :root{
    --cream:#F7F4EC;
    --ink:#17181A;
    --sub:#4A4D52;
    --accent:#2563EB;
    --accent-ink:#FFFFFF;
    --border:#E7E2D6;
    --disclaimer:#6B6E73;
    --headline:#2E4A33;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  .hero{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
  }
  .content{
    position:relative;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:18px;
    padding:32px 24px;
    max-width:680px;
    margin:0 auto;
  }
  .badge{
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--disclaimer);
    border:1px solid var(--border);
    border-radius:999px;
    padding:7px 16px;
    background:rgba(255,255,255,.75);
  }
  h1{
    font-size:clamp(30px,6vw,58px);
    line-height:1.1;
    font-weight:800;
    color:var(--headline);
    margin:0;
    text-wrap:balance;
    max-width:15ch;
  }
  .sub{
    font-size:clamp(16px,2.2vw,19px);
    font-weight:600;
    color:#2C2E31;
    max-width:50ch;
    line-height:1.45;
    margin:0;
  }
  .cta{
    appearance:none;
    border:none;
    cursor:pointer;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:inherit;
    font-weight:700;
    font-size:17px;
    letter-spacing:.03em;
    padding:20px 40px;
    border-radius:12px;
    box-shadow:0 12px 28px -12px rgba(37,99,235,.65);
    max-width:360px;
    line-height:1.3;
    margin-top:6px;
  }
  .lock{
    font-size:13px;
    font-weight:600;
    color:#3A3D40;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .fine{
    font-size:12px;
    font-weight:600;
    color:#3A3D40;
    max-width:38ch;
    line-height:1.4;
    margin:0;
  }

  @media (max-width:640px){
    .content{ padding:26px 20px; }
  }
</style>
</head>
<body>

<!-- RedTrack universal script (Home Service, "click support - for affiliates") -->
<script async src="https://trackrt.sweethomecasa.com/unilpclick.js?attribution=lastpaid&cookiedomain=&cookieduration=90&defaultcampaignid=&regviewonce=false&script_id=6a9dfbc2659890b0b77ef49d"></script>

<!-- No Meta Pixel here on purpose (2026-09-28): the real Lead event already arrives via RedTrack's
     server-side CAPI, independent of the browser. Same decision as windows-prelander.html. -->

<div class="hero">
  <div class="content">
    <div class="badge">Home Service · Bathroom</div>
    <h1>This Could Be Your Dream Bathroom</h1>
    <p class="sub">Say bye to your old bathroom and enjoy your home again.</p>
    <button class="cta" id="ctaBtn">GET YOUR FREE QUOTE</button>
    <p class="lock">🔒 We keep your information 100% secure and confidential</p>
    <p class="fine">This is not a free service. Pricing may vary based on your project.</p>
  </div>
</div>

<script>
  document.getElementById('ctaBtn').addEventListener('click', function () {
    window.location.href = "https://trackrt.sweethomecasa.com/click";
  });
</script>

</body>
</html>
