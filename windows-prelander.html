<style>

  .badge{

    letter-spacing:.16em;

    background:rgba(255,255,255,.75);

    font-size:clamp(30px,6vw,58px);
    line-height:1.1;
    font-weight:800;
    color:var(--headline);
    margin:0;
    text-wrap:balance;
    max-width:15ch;
    text-shadow:0 1px 3px rgba(247,244,236,1), 0 2px 18px rgba(247,244,236,.95), 0 0 32px rgba(247,244,236,.7);
  }
  .sub{
    font-size:clamp(16px,2.2vw,19px);
    font-weight:600;
    color:#2C2E31;
    max-width:50ch;
    line-height:1.45;
    margin:0;
    text-shadow:0 1px 2px rgba(247,244,236,1), 0 1px 12px rgba(247,244,236,.95), 0 0 22px rgba(247,244,236,.7);
  }
  .cta{
    appearance:none;
    border:none;
    cursor:pointer;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:inherit;
    font-weight:700;
    font-size:17px;
    letter-spacing:.03em;
    padding:20px 40px;
    border-radius:12px;
    box-shadow:0 12px 28px -12px rgba(37,99,235,.65);
    max-width:360px;
    line-height:1.3;
    margin-top:6px;
  }
  .lock{
    font-size:13px;
    font-weight:600;
    color:#3A3D40;
    display:flex;
    align-items:center;
    gap:6px;
    text-shadow:0 1px 2px rgba(247,244,236,1), 0 1px 10px rgba(247,244,236,.95);
  }
  .fine{
    font-size:12px;
    font-weight:600;
    color:#3A3D40;
    max-width:38ch;
    line-height:1.4;
    margin:0;
    text-shadow:0 1px 2px rgba(247,244,236,1), 0 1px 10px rgba(247,244,236,.95);
  }

  @media (max-width:640px){
    .content{ padding:26px 20px; }
    .overlay{
      background:radial-gradient(ellipse 60% 34% at 50% 46%, rgba(247,244,236,.82) 0%, rgba(247,244,236,.68) 45%, rgba(247,244,236,.28) 68%, rgba(247,244,236,0) 88%);
