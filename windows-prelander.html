<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Window Replacement Quotes</title>
<style>
  :root{
    --bg:#F7F4EC;
    --ink:#17181A;
    --sub:#4A4D52;
    --accent:#2563EB;
    --accent-ink:#FFFFFF;
    --card:#FFFFFF;
    --border:#E7E2D6;
    --disclaimer:#6B6E73;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  .hero{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .hero-img{
    width:100%;
    height:38svh;
    height:38vh;
    object-fit:cover;
    display:block;
  }
  .content{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    gap:12px;
    padding:26px 20px 22px;
    background:var(--bg);
  }
  .badge{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--disclaimer);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 12px;
  }
  h1{
    font-size:clamp(22px,6vw,42px);
    line-height:1.14;
    font-weight:800;
    color:#34523B;
    margin:0;
    text-wrap:balance;
    max-width:16ch;
  }
  .sub{
    font-size:15px;
    color:var(--sub);
    max-width:36ch;
    line-height:1.4;
    margin:0;
  }
  .cta{
    appearance:none;
    border:none;
    cursor:pointer;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    letter-spacing:.03em;
    padding:15px 36px;
    border-radius:10px;
    box-shadow:0 10px 24px -12px rgba(37,99,235,.65);
  }
  .lock{
    font-size:12px;
    color:var(--disclaimer);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .fine{
    font-size:11px;
    color:var(--disclaimer);
    max-width:34ch;
    line-height:1.4;
    margin:0;
  }

  /* Desktop: photo as full-bleed background, text overlaid on the left */
  @media (min-width:768px){
    .hero{
      display:block;
    }
    .hero-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }
    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(10,12,14,.62) 0%, rgba(10,12,14,.42) 32%, rgba(10,12,14,0) 58%);
    }
    .content{
      position:absolute;
      left:0;top:0;bottom:0;
      width:100%;
      max-width:560px;
      padding:0 32px 0 56px;
      background:none;
      gap:18px;
      align-items:flex-start;
      text-align:left;
      justify-content:center;
    }
    .badge{
      color:#fff;
      border-color:rgba(255,255,255,.4);
    }
    h1{
      font-size:clamp(32px,4vw,44px);
      max-width:14ch;
      color:#fff;
      text-shadow:0 2px 14px rgba(0,0,0,.35);
    }
    .sub{
      font-size:17px;
      color:#E8E9EC;
      max-width:34ch;
    }
    .lock{ color:#E8E9EC; }
    .fine{ color:#C9CBD1; }
  }
</style>
</head>
<body>

<!-- RedTrack universal script (Home Service, "click support - for affiliates") -->
<script src="https://trackrt.sweethomecasa.com/unilpclick.js?attribution=lastpaid&cookiedomain=&cookieduration=90&defaultcampaignid=&regviewonce=false&script_id=6a9dfbc2659890b0b77ef49d"></script>

<!-- Meta Pixel base code (Bathroom24h 2026 dataset, shared across Home Service vertical) -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '4708218172740754');

<div class="hero">
  <img class="hero-img" src="bg-bright-room.webp" alt="Bright room with large windows">
  <div class="overlay"></div>
  <div class="content">
    <div class="badge">Home Service · Windows</div>
    <h1>Let's Find Your Window Contractor</h1>
    <p class="sub">Just click the button below — compare quotes and pricing from top-rated local pros.</p>
    <button class="cta" id="ctaBtn">ENTER YOUR ZIP CODE</button>
    <p class="lock">🔒 We keep your information 100% secure and confidential</p>
    <p class="fine">This is not a free service. Pricing may vary based on your project.</p>
  </div>
</div>

<script>
  document.getElementById('ctaBtn').addEventListener('click', () => {
    if (typeof fbq === 'function') { fbq('track', 'Lead'); }
    window.location.href = "https://trackrt.sweethomecasa.com/click";
  });
</script>

</body>
</html>
